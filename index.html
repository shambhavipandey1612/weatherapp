<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER APP</title>
    <link rel="stylesheet" href="styler.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
    
    <div class="searchbox">
        <input id="cityinput" type="text" placeholder="Enter the name of the city">
        <button id="btn">SEARCH</button>
    </div>
    <div id="weatherinfo">
        <h2 id="cityname"></h2>
        <p id="temperature"></p>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
